services:
  postgres:
    image: postgres:16-alpine
    container_name: adizz-postgres-compose
    environment:
      POSTGRES_USER: adizz
      POSTGRES_PASSWORD: adizz_password
      POSTGRES_DB: adizz
    ports:
      - "5432:5432"
    volumes:
      - adizz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adizz -d adizz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: adizz-backend
    environment:
      DATABASE_URL: postgresql://adizz:adizz_password@postgres:5432/adizz
      APP_NAME: Adizz
      APP_VERSION: 1.0.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: adizz-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  adizz_postgres_data:
