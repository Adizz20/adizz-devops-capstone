{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taskboard.fullname" . }}
  labels:
    app.kubernetes.io/name: taskboard
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "taskboard.fullname" . }}-frontend
            port:
              number: 80
{{- end }}
