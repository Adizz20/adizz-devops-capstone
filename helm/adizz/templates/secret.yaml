apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adizz.fullname" . }}-db
  labels:
    {{- include "adizz.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database: {{ .Values.postgres.database | quote }}
